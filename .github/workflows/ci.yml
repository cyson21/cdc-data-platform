name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-cloud-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Record Java runtime
        run: |
          mkdir -p artifacts/non-cloud
          java -version 2> artifacts/non-cloud/java-version.txt
          java -XshowSettings:properties -version 2>&1 \
            | grep -E 'java\.version = 21([.+-]|$)' \
            > artifacts/non-cloud/java-21-check.txt

      - name: Maven non-cloud regression
        run: |
          mvn -B -ntp -f backend/pom.xml clean test \
            -Dtest=CdcDataPlatformApplicationTest,CanonicalIngestControllerTest,CanonicalIngestServiceTest,CdcEventIdTest,DebeziumEnvelopeTest,ConnectorHealthControllerTest,ConnectorHealthHttpControllerTest,ConnectorHealthServiceTest,LocalLakehouseObjectSinkTest,PipelineQualityControllerTest,PipelineQualityServiceTest,ReplayRequestControllerTest,RetryEventControllerTest

      - name: Python non-cloud runner regression
        run: |
          python3 -m unittest \
            tools.tests.test_portfolio_evidence \
            tools.tests.test_cdc_smoke_fixture \
            tools.tests.test_lakehouse_smoke \
            tools.tests.test_ci_coverage_scopes

      - name: Generate non-cloud portfolio evidence
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 tools/portfolio_evidence.py \
            --reports backend/target/surefire-reports \
            --output artifacts/non-cloud/portfolio-evidence.json

      - name: Upload non-cloud evidence and Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdc-data-platform-non-cloud-evidence
          path: |
            artifacts/non-cloud/
            backend/target/surefire-reports/
          if-no-files-found: error

  testcontainers-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Record Java runtime
        run: |
          mkdir -p artifacts/testcontainers
          java -version 2> artifacts/testcontainers/java-version.txt
          java -XshowSettings:properties -version 2>&1 \
            | grep -E 'java\.version = 21([.+-]|$)' \
            > artifacts/testcontainers/java-21-check.txt
          docker version > artifacts/testcontainers/docker-version.txt

      - name: Maven Testcontainers regression
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          mvn -B -ntp -f backend/pom.xml clean test \
            -Dtest=ConnectorHealthRepositoryTest,CdcEventLedgerRepositoryTest,PipelineQualityCheckRepositoryTest,PipelineQualitySlaRepositoryTest,ReplayRequestServiceTest,KafkaRetryEventPublisherTest,RecoveryRunServiceTest,SinkFailureReplayFlowTest,RetryEventServiceTest,SchemaMigrationTest

      - name: Record Testcontainers evidence boundary
        if: success()
        run: |
          cat > artifacts/testcontainers/evidence-boundary.txt <<'EOF'
          scope: testcontainers-postgres
          proven: Flyway schema migration and JDBC repository/service flows against ephemeral PostgreSQL
          not-proven: full local compose stack, live Debezium change capture, Athena/dbt, cloud resources
          EOF

      - name: Upload Testcontainers Surefire diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdc-data-platform-testcontainers-surefire
          path: |
            artifacts/testcontainers/
            backend/target/surefire-reports/
          if-no-files-found: error
