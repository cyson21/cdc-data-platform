services:
  source-postgres:
    image: postgres:16
    container_name: cdc-source-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ats_source
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
    ports:
      - "5433:5432"
    volumes:
      - source-postgres-data:/var/lib/postgresql/data
      - ../../backend/src/main/resources/db/migration/V1__source_schema.sql:/docker-entrypoint-initdb.d/001_source_schema.sql:ro
    networks:
      - cdc-local

  control-postgres:
    image: postgres:16
    container_name: cdc-control-postgres
    environment:
      POSTGRES_DB: cdc_control
      POSTGRES_USER: control_user
      POSTGRES_PASSWORD: control_password
    ports:
      - "5434:5432"
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
      - ../../backend/src/main/resources/db/migration/V2__control_plane_schema.sql:/docker-entrypoint-initdb.d/001_control_plane_schema.sql:ro
    networks:
      - cdc-local

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: cdc-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cdc-local

  kafka-connect:
    build:
      context: ../..
      dockerfile: infra/local/connect-postgres.Dockerfile
    image: cdc-data-platform/debezium-connect-postgres:2.7
    container_name: cdc-kafka-connect
    depends_on:
      - kafka
      - source-postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cdc-data-platform-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_PARTITIONS: 1
      STATUS_STORAGE_PARTITIONS: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "8083:8083"
    networks:
      - cdc-local

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cdc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - cdc-local

  iceberg-catalog-postgres:
    image: postgres:16
    container_name: cdc-iceberg-catalog-postgres
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    ports:
      - "5435:5432"
    volumes:
      - iceberg-catalog-postgres-data:/var/lib/postgresql/data
    networks:
      - cdc-local

  trino:
    image: trinodb/trino:455
    container_name: cdc-trino
    command:
      - /bin/sh
      - -c
      - |
        for plugin in /usr/lib/trino/plugin/*; do
          plugin_name="$${plugin##*/}"
          if [ "$$plugin_name" != "iceberg" ]; then
            rm -rf "$$plugin"
          fi
        done
        exec /usr/lib/trino/bin/run-trino
    depends_on:
      - minio
      - iceberg-catalog-postgres
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    networks:
      - cdc-local

networks:
  cdc-local:
    name: cdc-local

volumes:
  source-postgres-data:
  control-postgres-data:
  kafka-data:
  minio-data:
  iceberg-catalog-postgres-data:
