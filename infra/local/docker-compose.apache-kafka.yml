services:
  source-postgres:
    image: postgres:16-alpine
    container_name: cdc05-source-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=3
      - -c
      - max_wal_senders=3
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=20

  kafka:
    image: apache/kafka:4.2.0
    container_name: cdc05-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 2097152
      KAFKA_LOG_CLEANER_THREADS: 1
      KAFKA_NUM_NETWORK_THREADS: 1
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_BACKGROUND_THREADS: 2
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=32m

  kafka-connect:
    container_name: cdc05-kafka-connect
    environment:
      PRODUCER_BUFFER_MEMORY: 1048576
      PRODUCER_BATCH_SIZE: 4096
      KAFKA_HEAP_OPTS: -Xms64m -Xmx160m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=32m
